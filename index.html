<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Galaxia ✨</title>
  <style>
    body {
      background-color: #0d0714;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      color: #e0aaff;
      font-size: 2rem;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    p.sub {
      color: #c77dff;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* Grid de estrellas visibles */
    .star-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .star-btn {
      background: #1e1035;
      border: 2px solid #d697ff;
      color: #ffffff;
      font-size: 28px;
      padding: 15px 22px;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(214, 151, 255, 0.4);
    }

    .star-btn:active {
      background: #3c1e69;
      transform: scale(0.95);
    }

    /* Modal / Ventana emergente */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #180e29;
      border: 2px solid #d697ff;
      border-radius: 20px;
      padding: 20px;
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    .modal-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
      color: #ffffff;
      max-height: 60vh;
      overflow-y: auto;
    }

    .close-btn {
      background: #c77dff;
      border: none;
      color: #ffffff;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Feliz Primer Mes ✨</h1>
  <p class="sub">Toca cada estrella para abrir un mensaje</p>

  <div class="star-grid">
    <button class="star-btn" onclick="ver(0)">✦ 1</button>
    <button class="star-btn" onclick="ver(1)">✦ 2</button>
    <button class="star-btn" onclick="ver(2)">✦ 3</button>
    <button class="star-btn" onclick="ver(3)">✦ 4</button>
    <button class="star-btn" onclick="ver(4)">✦ 5</button>
    <button class="star-btn" onclick="ver(5)">✦ 6</button>
    <button class="star-btn" onclick="ver(6)">✦ 7</button>
    <button class="star-btn" onclick="ver(7)">✦ 8</button>
    <button class="star-btn" onclick="ver(8)">✦ 9</button>
    <button class="star-btn" onclick="ver(9)">✦ 10</button>
    <button class="star-btn" onclick="ver(10)">✦ 11</button>
    <button class="star-btn" onclick="ver(11)">✦ 12</button>
    <button class="star-btn" onclick="ver(12)">✦ 13</button>
    <button class="star-btn" onclick="ver(13)">✦ 14</button>
    <button class="star-btn" onclick="ver(14)">✦ 15</button>
    <button class="star-btn" onclick="ver(15)">✦ 16</button>
  </div>

  <div class="modal" id="messageModal">
    <div class="modal-content">
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="cerrar()">Cerrar ✨</button>
    </div>
  </div>

  <script>
    var msgs = [
      "Qué peligro esa mujer pensé al escucharte por primera vez. Peligrosamente mujer, peligrosamente tú. Y yo, un hombre de aventura y amante de los desafíos, cedí ciegamente a esa sonrisa que aceleraba peligrosamente mis latidos. Una parte dentro de mí me decía tonto, la otra afortunado, pero ninguna de las dos partes jamás pensaron en lo peligrosamente que estaría de ti enamorado. Enamorado de unos peligrosos ojos que paralizan, de unos peligrosos labios que cautivan, de un peligroso cabello que hipnotiza, de un hermoso cuerpo que desde lo lejos al deseo incita. Enamorado de ti, de la maravillosa mujer que eres, peligrosamente mujer, peligrosamente tú.",
      "Dime, ¿crees en la magia? Porque cada momento contigo se siente como algo mágico, como salido de un cuento. Por ratos, mientras hablo contigo, se me viene a la mente la escena de Peter Pan cuando Campanita está muriendo y la reaniman repitiendo que creen en las hadas. Y mágicamente vuelve a la vida. No te lo había dicho, pero eso provoca que sienta mariposas en el estómago. Porque siento que valió la espera que encontré a mi fiel compañera, la otra mitad de la cual no quiero separarme nunca más. Mi querida hada chalada.",
      "Dicen que algunos encuentros lo cambian todo y el nuestro es uno de ellos. Me haces querer ser mejor que ayer y por eso estoy totalmente agradecido contigo. Gracias.",
      "Las semillas no son tan malas después de todo, mi pichoncita. 💖",
      "No a esas preguntas que no tienen respuesta. ✨",
      "Me pareció muy lindo cuando le hablaste a la planta inexistente en audio para que yo escuchara. Qué linda. 🌱❤️",
      "Gracias por los dibujos. Están muy lindos, me encantaron mucho. 🎨✨",
      "Eres lo mejor que me pudo haber pasado. ✨",
      "Te amo, mi amor. ❤️",
      "Gracias por existir, mi princesa. 👑✨",
      "El amor no conoce fronteras ni distancias. Al superar esta etapa seremos muy felices. 💕",
      "Eres la mejor, nunca lo olvides. ✨",
      "Qué peligro, Guillermina. 😏✨",
      "Nuestro primer mes de novios. 🎉❤️",
      "Significas mucho para mí. ✨",
      "Gracias por haber llegado a mi vida. Te amo. ❤️"
    ];

    function ver(i) {
      document.getElementById('modalText').innerText = msgs[i];
      document.getElementById('messageModal').style.display = 'flex';
    }

    function cerrar() {
      document.getElementById('messageModal').style.display = 'none';
    }
  </script>
</body>
</html>
