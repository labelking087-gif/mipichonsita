<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d061a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding-bottom: 90px;
    }

    /* Canvas de fondo estelar */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Silueta inferior de horizonte */
    .horizon-silhouette {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 180px;
      background: linear-gradient(to top, #090312 20%, rgba(9, 3, 18, 0.8) 60%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Cabecera y Paneles */
    .header-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 1100px;
      text-align: center;
      margin-top: 25px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      color: #f7eeff;
      text-shadow: 0 0 20px rgba(224, 170, 255, 0.9), 0 0 40px rgba(199, 125, 255, 0.6);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.95;
      color: #e0aaff;
      margin-bottom: 14px;
    }

    .progress-badge {
      display: inline-block;
      background: rgba(224, 170, 255, 0.22);
      border: 1px solid rgba(224, 170, 255, 0.5);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #f3e8ff;
      margin-bottom: 18px;
      font-weight: bold;
      box-shadow: 0 0 18px rgba(224, 170, 255, 0.35);
      backdrop-filter: blur(5px);
    }

    /* Panel de Tiempos Horizontal */
    .timer-panel {
      background: rgba(30, 15, 54, 0.78);
      border: 1px solid rgba(224, 170, 255, 0.4);
      border-radius: 20px;
      padding: 16px 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(199, 125, 255, 0.3);
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .timer-item {
      flex: 1;
      min-width: 220px;
      text-align: center;
    }

    .timer-label {
      font-size: 0.75rem;
      color: #e0aaff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .timer-val {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    /* Espacio Cósmico Panorámico */
    .galaxy-cosmos {
      position: relative;
      width: 100vw;
      max-width: 1200px;
      height: 680px;
      z-index: 2;
      margin-top: 10px;
    }

    /* Estrellas flotantes interactivas */
    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 32px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 15px #ffffff, 0 0 25px #e0aaff, 0 0 40px #c77dff;
      padding: 15px;
      animation: float-twinkle 3.5s infinite alternate ease-in-out;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .star::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 45px;
      height: 45px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(243, 232, 255, 0.7) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      animation: pulse-halo 2s infinite alternate ease-in-out;
    }

    @keyframes pulse-halo {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0.9; }
    }

    .star.opened {
      color: #ffd166;
      text-shadow: 0 0 18px #ffd166, 0 0 35px #ffb703;
    }
    .star.opened::before {
      background: radial-gradient(circle, rgba(255, 209, 102, 0.6) 0%, transparent 70%);
    }

    @keyframes float-twinkle {
      0% { opacity: 0.5; transform: scale(0.95) translateY(0px); }
      100% { opacity: 1; transform: scale(1.2) translateY(-6px); }
    }

    /* Partículas de Corazón */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      z-index: 10002;
      font-size: 18px;
      animation: explode-heart 1.2s forwards ease-out;
    }

    @keyframes explode-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }

    /* Modales Estables */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(12, 6, 26, 0.92);
      backdrop-filter: blur(8px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(145deg, #23123d, #170a2a);
      border: 1px solid rgba(224, 170, 255, 0.45);
      border-radius: 20px;
      padding: 25px 20px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 30px rgba(199, 125, 255, 0.3);
    }

    .modal-text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 20px;
      white-space: pre-line;
      color: #fdf8ff;
      font-style: italic;
      max-height: 55vh;
      overflow-y: auto;
    }

    /* Estilo para la imagen del dibujo */
    .drawing-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      border: 2px solid rgba(224, 170, 255, 0.4);
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(199, 125, 255, 0.3);
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
