<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #080314 60%, #020108 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #space-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Estrellitas diminutas de fondo */
    .bg-star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle-bg infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes twinkle-bg {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: 0.7; transform: scale(1.2); }
    }

    /* Estrellas interactivas principales */
    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 30px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #d697ff, 0 0 30px #a259ff;
      padding: 16px;
      z-index: 9999;
      touch-action: manipulation;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #e0aaff;
      text-shadow: 0 0 20px rgba(214, 151, 255, 0.8);
      pointer-events: none;
    }

    p.subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      pointer-events: none;
    }

    /* Ventana Emergente (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 10, 0.92);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(28, 18, 52, 0.95);
      border: 1px solid rgba(214, 151, 255, 0.4);
      border-radius: 20px;
      padding: 25px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .media-container {
      width: 100%;
      max-height: 320px;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
    }

    .modal-media {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal-text {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 20px;
      font-weight: 300;
      white-space: pre-line;
      display: none;
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }
  </style>
</head>
