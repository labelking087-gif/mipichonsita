<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #080314 60%, #020108 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding-bottom: 60px;
    }

    /* Fondo espacial interactivo */
    #space-bg {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Nubes de Nebulosa */
    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: pulse-nebula 12s infinite alternate ease-in-out;
    }
    .neb1 { top: -10%; left: 10%; width: 500px; height: 500px; background: #7b2cbf; }
    .neb2 { bottom: 0%; right: 5%; width: 600px; height: 600px; background: #3a0ca3; }
    .neb3 { top: 40%; left: 35%; width: 450px; height: 450px; background: #b5179e; }

    @keyframes pulse-nebula {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.2; }
      100% { transform: scale(1.15) translate(20px, -20px); opacity: 0.35; }
    }

    /* Polvo estelar */
    .dust {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle-bg 3s infinite alternate ease-in-out;
    }

    @keyframes twinkle-bg {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: 0.85; transform: scale(1.4); }
    }

    /* Estrellas fugaces */
    .shooting-star {
      position: absolute;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
      opacity: 0;
      transform: rotate(-35deg);
      animation: shoot 8s infinite ease-in-out;
    }

    @keyframes shoot {
      0% { top: -5%; left: 50%; opacity: 0; width: 0px; }
      10% { opacity: 1; width: 140px; }
      20% { top: 60%; left: -10%; opacity: 0; width: 0px; }
      100% { top: 60%; left: -10%; opacity: 0; }
    }

    /* Cabecera y Paneles */
    .header-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 1100px;
      text-align: center;
      margin-top: 25px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      color: #f3e8ff;
      text-shadow: 0 0 20px rgba(214, 151, 255, 0.8), 0 0 40px rgba(199, 125, 255, 0.4);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.9;
      color: #d697ff;
      margin-bottom: 14px;
    }

    .progress-badge {
      display: inline-block;
      background: rgba(214, 151, 255, 0.15);
      border: 1px solid rgba(214, 151, 255, 0.4);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #e0aaff;
      margin-bottom: 18px;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(214, 151, 255, 0.2);
    }

    /* Panel de Tiempos Horizontal */
    .timer-panel {
      background: rgba(24, 14, 41, 0.85);
      border: 1px solid rgba(214, 151, 255, 0.35);
      border-radius: 20px;
      padding: 16px 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(123, 44, 191, 0.25);
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .timer-item {
      flex: 1;
      min-width: 220px;
      text-align: center;
    }

    .timer-label {
      font-size: 0.75rem;
      color: #c77dff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .timer-val {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Espacio Cósmico Panorámico */
    .galaxy-cosmos {
      position: relative;
      width: 100vw;
      max-width: 1200px;
      height: 600px;
      z-index: 2;
      margin-top: 10px;
    }

    /* Estrellas flotantes */
    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 30px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 12px #ffffff, 0 0 22px #d697ff, 0 0 38px #a259ff;
      padding: 15px;
      animation: float-twinkle 3.5s infinite alternate ease-in-out;
      transition: color 0.3s, transform 0.3s, text-shadow 0.3s;
    }

    /* Aura luminosa de estrella */
    .star::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(214, 151, 255, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      animation: pulse-halo 2s infinite alternate ease-in-out;
    }

    @keyframes pulse-halo {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.8; }
    }

    .star.opened {
      color: #ffd166;
      text-shadow: 0 0 15px #ffd166, 0 0 30px #ffb703;
    }
    .star.opened::before {
      background: radial-gradient(circle, rgba(255, 209, 102, 0.5) 0%, transparent 70%);
    }

    @keyframes float-twinkle {
      0% { opacity: 0.4; transform: scale(0.9) translateY(0px); }
      100% { opacity: 1; transform: scale(1.3) translateY(-8px); }
    }

    /* Coordenadas Panorámicas */
    .s1  { top: 5%;   left: 6%;   animation-delay: 0.2s; font-size: 28px; }
    .s2  { top: 12%;  left: 88%;  animation-delay: 0.9s; font-size: 34px; }
    .s3  { top: 18%;  left: 48%;  animation-delay: 0.4s; font-size: 26px; }
    .s4  { top: 25%;  left: 22%;  animation-delay: 1.2s; font-size: 32px; }
    .s5  { top: 28%;  left: 76%;  animation-delay: 0.1s; font-size: 28px; }
    .s6  { top: 40%;  left: 58%;  animation-delay: 1.5s; font-size: 36px; }
    .s7  { top: 42%;  left: 10%;  animation-delay: 0.6s; font-size: 30px; }
    .s8  { top: 52%;  left: 84%;  animation-delay: 1.1s; font-size: 26px; }
    .s9  { top: 58%;  left: 32%;  animation-delay: 0.3s; font-size: 33px; }
    .s10 { top: 68%;  left: 92%;  animation-delay: 0.8s; font-size: 29px; }
    .s11 { top: 72%;  left: 8%;   animation-delay: 1.4s; font-size: 35px; }
    .s12 { top: 78%;  left: 62%;  animation-delay: 0.5s; font-size: 28px; }
    .s13 { top: 82%;  left: 25%;  animation-delay: 1.0s; font-size: 32px; }
    .s14 { top: 88%;  left: 78%;  animation-delay: 0.7s; font-size: 26px; }
    .s15 { top: 92%;  left: 44%;  animation-delay: 1.3s; font-size: 34px; }
    .s16 { top: 95%;  left: 14%;  animation-delay: 0.2s; font-size: 30px; }

    /* Partículas de Corazón al Clic */
    .heart-particle {
      position: absolute;
      pointer-events: none;
      z-index: 10002;
      font-size: 16px;
      animation: explode-heart 1s forwards ease-out;
    }

    @keyframes explode-heart {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }

    /* Estela de Cursor */
    .cursor-trail {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #e0aaff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 8px #ffffff, 0 0 12px #c77dff;
      z-index: 9999;
      animation: fade-trail 0.6s forwards linear;
    }

    @keyframes fade-trail {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.1); }
    }

    /* Modal Emergente */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 10, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(145deg, #180b2b, #110620);
      border: 1px solid rgba(214, 151, 255, 0.4);
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(214, 151, 255, 0.2);
    }

    .modal-text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.1rem;
      line-height: 1.85;
      margin-bottom: 25px;
      white-space: pre-line;
      color: #fdf8ff;
      font-style: italic;
      max-height: 60vh;
      overflow-y: auto;
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 12px 32px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(199, 125, 255, 0.4);
    }

    .music-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: linear-gradient(135deg, #7b2cbf, #c77dff);
      color: #ffffff;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10001;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(199, 125, 255, 0.6);
    }

    #yt-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="space-bg">
    <div class="nebula neb1"></div>
    <div class="nebula neb2"></div>
    <div class="nebula neb3"></div>
    <div class="shooting-star"></div>
  </div>

  <div class="header-container">
    <h1>Feliz Primer Mes ✨</h1>
    <p class="subtitle">Toca cada estrella para descubrir un secreto.</p>

    <div class="progress-badge" id="progressBadge">Estrellas descubiertas: 0 / 16</div>

    <div class="timer-panel">
      <div class="timer-item">
        <div class="timer-label">✨ Nos conocimos</div>
        <div class="timer-val" id="timeConocimos">Cargando...</div>
      </div>
      <div class="timer-item">
        <div class="timer-label">💬 Conectamos más</div>
        <div class="timer-val" id="timeCercanos">Cargando...</div>
      </div>
      <div class="timer-item">
        <div class="timer-label">❤️ Oficialmente novios</div>
        <div class="timer-val" id="timeNovios">Cargando...</div>
      </div>
    </div>
  </div>

  <div class="galaxy-cosmos">
    <div class="star s1" id="st0" onclick="ver(0, event)">✦</div>
    <div class="star s2" id="st1" onclick="ver(1, event)">✦</div>
    <div class="star s3" id="st2" onclick="ver(2, event)">✦</div>
    <div class="star s4" id="st3" onclick="ver(3, event)">✦</div>
    <div class="star s5" id="st4" onclick="ver(4, event)">✦</div>
    <div class="star s6" id="st5" onclick="ver(5, event)">✦</div>
    <div class="star s7" id="st6" onclick="ver(6, event)">✦</div>
    <div class="star s8" id="st7" onclick="ver(7, event)">✦</div>
    <div class="star s9" id="st8" onclick="ver(8, event)">✦</div>
    <div class="star s10" id="st9" onclick="ver(9, event)">✦</div>
    <div class="star s11" id="st10" onclick="ver(10, event)">✦</div>
    <div class="star s12" id="st11" onclick="ver(11, event)">✦</div>
    <div class="star s13" id="st12" onclick="ver(12, event)">✦</div>
    <div class="star s14" id="st13" onclick="ver(13, event)">✦</div>
    <div class="star s15" id="st14" onclick="ver(14, event)">✦</div>
    <div class="star s16" id="st15" onclick="ver(15, event)">✦</div>
  </div>

  <div class="modal" id="messageModal">
    <div class="modal-content">
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="cerrar()">Cerrar ✨</button>
    </div>
  </div>

  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
  <div id="ytPlayerContainer"></div>

  <script>
    var msgs = [
      "Qué peligro esa mujer pensé al escucharte por primera vez. Peligrosamente mujer, peligrosamente tú. Y yo, un hombre de aventura y amante de los desafíos, cedí ciegamente a esa sonrisa que aceleraba peligrosamente mis latidos. Una parte dentro de mí me decía tonto, la otra afortunado, pero ninguna de las dos partes jamás pensaron en lo peligrosamente que estarías de ti enamorado. Enamorado de unos peligrosos ojos que paralizan, de unos peligrosos labios que cautivan, de un peligroso cabello que hipnotiza, de un hermoso cuerpo que desde lo lejos al deseo incita. Enamorado de ti, de la maravillosa mujer que eres, peligrosamente mujer, peligrosamente tú.",
      "Dime, ¿crees en la magia? Porque cada momento contigo se siente como algo mágico, como salido de un cuento. Por ratos, mientras hablo contigo, se me viene a la mente la escena de Peter Pan cuando Campanita está muriendo y la reaniman repitiendo que creen en las hadas. Y mágicamente vuelve a la vida. No te lo había dicho, pero eso provoca que sienta mariposas en el estómago. Porque siento que valió la espera que encontré a mi fiel compañera, la otra mitad de la cual no quiero separarme nunca más. Mi querida hada chalada.",
      "Dicen que algunos encuentros lo cambian todo y el nuestro es uno de ellos. Me haces querer ser mejor que ayer y por eso estoy totalmente agradecido contigo. Gracias.",
      "Las semillas no son tan malas después de todo, mi pichoncita. 💖",
      "No a esas preguntas que no tienen respuesta. ✨",
      "Me pareció muy lindo cuando le hablaste a la planta inexistente en audio para que yo escuchara. Qué linda. 🌱❤️",
      "Gracias por los dibujos. Están muy lindos, me encantaron mucho. 🎨✨",
      "Eres lo mejor que me pudo haber pasado. ✨",
      "Te amo, mi amor. ❤️",
      "Gracias por existir, mi princesa. 👑✨",
      "El amor no conoce fronteras ni distancias. Al superar esta etapa seremos muy felices. 💕",
      "Eres la mejor, nunca lo olvides. ✨",
      "Qué peligro, Guillermina. 😏✨",
      "Nuestro primer mes de novios. 🎉❤️",
      "Significas mucho para mí. ✨",
      "Gracias por haber llegado a mi vida. Te amo. ❤️"
    ];

    var openedStars = {};
    var openedCount = 0;

    // Generar polvo estelar de fondo
    var bg = document.getElementById('space-bg');
    for (var k = 0; k < 85; k++) {
      var d = document.createElement('div');
      d.className = 'dust';
      d.style.left = Math.floor(Math.random() * 100) + '%';
      d.style.top = Math.floor(Math.random() * 100) + '%';
      var sz = (Math.random() * 2.5 + 1).toFixed(1);
      d.style.width = sz + 'px';
      d.style.height = sz + 'px';
      d.style.animationDuration = (Math.random() * 3 + 1.5).toFixed(1) + 's';
      bg.appendChild(d);
    }

    // Estela con el cursor en PC
    window.addEventListener('mousemove', function(e) {
      if (Math.random() < 0.3) {
        var trail = document.createElement('div');
        trail.className = 'cursor-trail';
        trail.style.left = e.pageX + 'px';
        trail.style.top = e.pageY + 'px';
        document.body.appendChild(trail);
        setTimeout(function() { trail.remove(); }, 600);
      }
    });

    // Explosión de Corazones al Hacer Clic
    function createHeartExplosion(x, y) {
      var hearts = ['💖', '✨', '🌸', '💕'];
      for (var i = 0; i < 8; i++) {
        var h = document.createElement('div');
        h.className = 'heart-particle';
        h.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = x + 'px';
        h.style.top = y + 'px';
        var angle = Math.random() * Math.PI * 2;
        var dist = Math.random() * 60 + 30;
        h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(h);
        setTimeout(function(el) { el.remove(); }, 1000, h);
      }
    }

    function ver(i, e) {
      if (e) createHeartExplosion(e.pageX, e.pageY);

      document.getElementById('modalText').innerText = msgs[i];
      document.getElementById('messageModal').style.display = 'flex';

      if (!openedStars[i]) {
        openedStars[i] = true;
        openedCount++;
        document.getElementById('st' + i).classList.add('opened');
        document.getElementById('progressBadge').innerText = 'Estrellas descubiertas: ' + openedCount + ' / 16';
      }

      if (!musicStarted) {
        startMusic();
      }
    }

    function cerrar() {
      document.getElementById('messageModal').style.display = 'none';
    }

    // Temporizadores
    var dateConocimos = new Date(2025, 2, 15, 0, 0, 0); // 15 Mar 2025
    var dateCercanos  = new Date(2026, 6, 26, 0, 0, 0); // 26 Jul 2026
    var dateNovios    = new Date(2026, 8, 19, 0, 0, 0); // 19 Sep 2026

    function formatTimeDiff(fromDate) {
      var now = new Date();
      var diff = now - fromDate;
      if (diff < 0) diff = 0;

      var seconds = Math.floor((diff / 1000) % 60);
      var minutes = Math.floor((diff / (1000 * 60)) % 60);
      var hours   = Math.floor((diff / (1000 * 60 * 60)) % 24);
      var days    = Math.floor(diff / (1000 * 60 * 60 * 24));

      return days + " días, " + hours + "h " + minutes + "m " + seconds + "s";
    }

    function updateTimers() {
      document.getElementById('timeConocimos').innerText = formatTimeDiff(dateConocimos);
      document.getElementById('timeCercanos').innerText  = formatTimeDiff(dateCercanos);
      document.getElementById('timeNovios').innerText     = formatTimeDiff(dateNovios);
    }

    setInterval(updateTimers, 1000);
    updateTimers();

    // Reproductor de Música
    var musicStarted = false;
    var playerIsPlaying = false;

    function startMusic() {
      var container = document.getElementById('ytPlayerContainer');
      container.innerHTML = '<iframe id="yt-player" src="https://www.youtube.com/embed/iP0tHmoc1rs?enablejsapi=1&autoplay=1&loop=1&playlist=iP0tHmoc1rs" allow="autoplay"></iframe>';
      musicStarted = true;
      playerIsPlaying = true;
      document.getElementById('musicBtn').innerText = '🔊';
    }

    function toggleMusic() {
      if (!musicStarted) {
        startMusic();
        return;
      }
      var iframe = document.getElementById('yt-player');
      if (iframe) {
        if (playerIsPlaying) {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          document.getElementById('musicBtn').innerText = '🎵';
          playerIsPlaying = false;
        } else {
          iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          document.getElementById('musicBtn').innerText = '🔊';
          playerIsPlaying = true;
        }
      }
    }
  </script>
</body>
</html>
