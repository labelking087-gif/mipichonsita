<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #080314 60%, #020108 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #space-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .title-box {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #e0aaff;
      text-shadow: 0 0 20px rgba(214, 151, 255, 0.8);
    }

    p.subtitle {
      font-size: 1rem;
      opacity: 0.9;
      color: #d697ff;
    }

    /* Estrellas interactivas flotantes */
    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 28px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #d697ff, 0 0 35px #a259ff;
      padding: 15px;
      z-index: 999;
      animation: float-twinkle 3s infinite alternate ease-in-out;
    }

    @keyframes float-twinkle {
      0% { opacity: 0.4; transform: scale(0.9) translateY(0px); }
      100% { opacity: 1; transform: scale(1.2) translateY(-6px); }
    }

    /* Posiciones estelares repartidas por la pantalla */
    .s1  { top: 12%; left: 15%; animation-delay: 0.2s; }
    .s2  { top: 18%; left: 75%; animation-delay: 0.8s; }
    .s3  { top: 28%; left: 38%; animation-delay: 0.4s; }
    .s4  { top: 35%; left: 82%; animation-delay: 1.1s; }
    .s5  { top: 45%; left: 12%; animation-delay: 0.1s; }
    .s6  { top: 52%; left: 68%; animation-delay: 1.4s; }
    .s7  { top: 62%; left: 25%; animation-delay: 0.6s; }
    .s8  { top: 70%; left: 85%; animation-delay: 1.2s; }
    .s9  { top: 78%; left: 15%; animation-delay: 0.3s; }
    .s10 { top: 82%; left: 55%; animation-delay: 0.9s; }
    .s11 { top: 22%; left: 58%; animation-delay: 1.5s; }
    .s12 { top: 58%; left: 45%; animation-delay: 0.5s; }
    .s13 { top: 15%; left: 42%; animation-delay: 1.0s; }
    .s14 { top: 72%; left: 38%; animation-delay: 0.7s; }
    .s15 { top: 40%; left: 50%; animation-delay: 1.3s; }
    .s16 { top: 88%; left: 78%; animation-delay: 0.2s; }

    /* Modal / Ventana Emergente */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 10, 0.94);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(24, 14, 41, 0.98);
      border: 1px solid rgba(214, 151, 255, 0.5);
      border-radius: 20px;
      padding: 25px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 35px rgba(214, 151, 255, 0.3);
    }

    .modal-text {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-line;
      color: #ffffff;
      max-height: 60vh;
      overflow-y: auto;
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="space-bg">
    <div class="star s1" onclick="ver(0)">✦</div>
    <div class="star s2" onclick="ver(1)">✦</div>
    <div class="star s3" onclick="ver(2)">✦</div>
    <div class="star s4" onclick="ver(3)">✦</div>
    <div class="star s5" onclick="ver(4)">✦</div>
    <div class="star s6" onclick="ver(5)">✦</div>
    <div class="star s7" onclick="ver(6)">✦</div>
    <div class="star s8" onclick="ver(7)">✦</div>
    <div class="star s9" onclick="ver(8)">✦</div>
    <div class="star s10" onclick="ver(9)">✦</div>
    <div class="star s11" onclick="ver(10)">✦</div>
    <div class="star s12" onclick="ver(11)">✦</div>
    <div class="star s13" onclick="ver(12)">✦</div>
    <div class="star s14" onclick="ver(13)">✦</div>
    <div class="star s15" onclick="ver(14)">✦</div>
    <div class="star s16" onclick="ver(15)">✦</div>
  </div>

  <div class="title-box">
    <h1>Feliz Primer Mes ✨</h1>
    <p class="subtitle">Toca cada estrella para descubrir un secreto.</p>
  </div>

  <div class="modal" id="messageModal">
    <div class="modal-content">
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="cerrar()">Cerrar ✨</button>
    </div>
  </div>

  <script>
    var msgs = [
      "Qué peligro esa mujer pensé al escucharte por primera vez. Peligrosamente mujer, peligrosamente tú. Y yo, un hombre de aventura y amante de los desafíos, cedí ciegamente a esa sonrisa que aceleraba peligrosamente mis latidos. Una parte dentro de mí me decía tonto, la otra afortunado, pero ninguna de las dos partes jamás pensaron en lo peligrosamente que estarías de ti enamorado. Enamorado de unos peligrosos ojos que paralizan, de unos peligrosos labios que cautivan, de un peligroso cabello que hipnotiza, de un hermoso cuerpo que desde lo lejos al deseo incita. Enamorado de ti, de la maravillosa mujer que eres, peligrosamente mujer, peligrosamente tú.",
      "Dime, ¿crees en la magia? Porque cada momento contigo se siente como algo mágico, como salido de un cuento. Por ratos, mientras hablo contigo, se me viene a la mente la escena de Peter Pan cuando Campanita está muriendo y la reaniman repitiendo que creen en las hadas. Y mágicamente vuelve a la vida. No te lo había dicho, pero eso provoca que sienta mariposas en el estómago. Porque siento que valió la espera que encontré a mi fiel compañera, la otra mitad de la cual no quiero separarme nunca más. Mi querida hada chalada.",
      "Dicen que algunos encuentros lo cambian todo y el nuestro es uno de ellos. Me haces querer ser mejor que ayer y por eso estoy totalmente agradecido contigo. Gracias.",
      "Las semillas no son tan malas después de todo, mi pichoncita. 💖",
      "No a esas preguntas que no tienen respuesta. ✨",
      "Me pareció muy lindo cuando le hablaste a la planta inexistente en audio para que yo escuchara. Qué linda. 🌱❤️",
      "Gracias por los dibujos. Están muy lindos, me encantaron mucho. 🎨✨",
      "Eres lo mejor que me pudo haber pasado. ✨",
      "Te amo, mi amor. ❤️",
      "Gracias por existir, mi princesa. 👑✨",
      "El amor no conoce fronteras ni distancias. Al superar esta etapa seremos muy felices. 💕",
      "Eres la mejor, nunca lo olvides. ✨",
      "Qué peligro, Guillermina. 😏✨",
      "Nuestro primer mes de novios. 🎉❤️",
      "Significas mucho para mí. ✨",
      "Gracias por haber llegado a mi vida. Te amo. ❤️"
    ];

    function ver(i) {
      document.getElementById('modalText').innerText = msgs[i];
      document.getElementById('messageModal').style.display = 'flex';
    }

    function cerrar() {
      document.getElementById('messageModal').style.display = 'none';
    }
  </script>
</body>
</html>
