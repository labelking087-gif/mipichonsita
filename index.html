<!-- Version 5.0 - Galaxia Orgánica y Espacio Realista -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Galaxia ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at bottom, #1b1035 0%, #080314 60%, #020108 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 20px 15px 90px 15px;
    }

    /* Fondo espacial interactivo y estrellas decorativas */
    #space-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .dust {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle-bg 3s infinite alternate ease-in-out;
    }

    @keyframes twinkle-bg {
      0% { opacity: 0.1; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }

    /* Contenedor Principal Superior */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
      color: #f3e8ff;
      text-shadow: 0 0 15px rgba(214, 151, 255, 0.8);
    }

    .subtitle {
      font-size: 0.88rem;
      opacity: 0.9;
      color: #d697ff;
      margin-bottom: 12px;
    }

    .progress-badge {
      display: inline-block;
      background: rgba(214, 151, 255, 0.15);
      border: 1px solid rgba(214, 151, 255, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      color: #e0aaff;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .timer-panel {
      background: rgba(24, 14, 41, 0.85);
      border: 1px solid rgba(214, 151, 255, 0.35);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .timer-item {
      margin-bottom: 8px;
    }

    .timer-item:last-child {
      margin-bottom: 0;
    }

    .timer-label {
      font-size: 0.72rem;
      color: #c77dff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .timer-val {
      font-size: 0.92rem;
      font-weight: 600;
      color: #ffffff;
    }

    /* Campo Cósmico Libre para Estrellas Dispersas */
    .galaxy-cosmos {
      position: relative;
      width: 100%;
      min-height: 580px;
      z-index: 2;
    }

    /* Estrellas Interactivas dispersas libremente */
    .star {
      position: absolute;
      cursor: pointer;
      color: #ffffff;
      font-size: 28px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #d697ff, 0 0 35px #a259ff;
      padding: 12px;
      animation: float-twinkle 3.5s infinite alternate ease-in-out;
      transition: color 0.3s, transform 0.2s;
    }

    .star.opened {
      color: #ffd166;
      text-shadow: 0 0 12px #ffd166, 0 0 25px #ffb703;
    }

    @keyframes float-twinkle {
      0% { opacity: 0.4; transform: scale(0.9) translateY(0px); }
      100% { opacity: 1; transform: scale(1.25) translateY(-6px); }
    }

    /* Coordenadas Asimétricas para Simular el Espacio Real */
    .s1  { top: 15px;  left: 8%;   animation-delay: 0.2s; font-size: 26px; }
    .s2  { top: 35px;  left: 78%;  animation-delay: 0.9s; font-size: 32px; }
    .s3  { top: 85px;  left: 45%;  animation-delay: 0.4s; font-size: 24px; }
    .s4  { top: 120px; left: 18%;  animation-delay: 1.2s; font-size: 30px; }
    .s5  { top: 155px; left: 82%;  animation-delay: 0.1s; font-size: 26px; }
    .s6  { top: 210px; left: 52%;  animation-delay: 1.5s; font-size: 34px; }
    .s7  { top: 230px; left: 12%;  animation-delay: 0.6s; font-size: 28px; }
    .s8  { top: 290px; left: 75%;  animation-delay: 1.1s; font-size: 25px; }
    .s9  { top: 320px; left: 35%;  animation-delay: 0.3s; font-size: 31px; }
    .s10 { top: 370px; left: 85%;  animation-delay: 0.8s; font-size: 27px; }
    .s11 { top: 395px; left: 10%;  animation-delay: 1.4s; font-size: 33px; }
    .s12 { top: 440px; left: 58%;  animation-delay: 0.5s; font-size: 26px; }
    .s13 { top: 480px; left: 28%;  animation-delay: 1.0s; font-size: 30px; }
    .s14 { top: 510px; left: 80%;  animation-delay: 0.7s; font-size: 24px; }
    .s15 { top: 535px; left: 8%;   animation-delay: 1.3s; font-size: 32px; }
    .s16 { top: 550px; left: 50%;  animation-delay: 0.2s; font-size: 28px; }

    /* Modal Emergente */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 2, 10, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(145deg, #180b2b, #110620);
      border: 1px solid rgba(214, 151, 255, 0.4);
      border-radius: 20px;
      padding: 25px 20px;
      max-width: 450px;
      width: 92%;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(214, 151, 255, 0.2);
    }

    .modal-text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 22px;
      white-space: pre-line;
      color: #fdf8ff;
      font-style: italic;
      max-height: 55vh;
      overflow-y: auto;
    }

    .close-btn {
      background: linear-gradient(135deg, #c77dff, #7b2cbf);
      border: none;
      color: white;
      padding: 10px 28px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(199, 125, 255, 0.4);
    }

    /* Botón Flotante de Música */
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #7b2cbf, #c77dff);
      color: #ffffff;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10001;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(199, 125, 255, 0.6);
    }

    #yt-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="space-bg"></div>

  <div class="container">
    <h1>Feliz Primer Mes ✨</h1>
    <p class="subtitle">Toca cada estrella para descubrir un secreto.</p>

    <div class="progress-badge" id="progressBadge">Estrellas descubiertas: 0 / 16</div>

    <div class="timer-panel">
      <div class="timer-item">
        <div class="timer-label">✨ Nos conocimos</div>
        <div class="timer-val" id="timeConocimos">Cargando...</div>
      </div>
      <div class="timer-item">
        <div class="timer-label">💬 Conectamos más</div>
        <div class="timer-val" id="timeCercanos">Cargando...</div>
      </div>
      <div class="timer-item">
        <div class="timer-label">❤️ Oficialmente novios</div>
        <div class="timer-val" id="timeNovios">Cargando...</div>
      </div>
    </div>

    <!-- Campo Cósmico con Estrellas Dispersas -->
    <div class="galaxy-cosmos">
      <div class="star s1" id="st0" onclick="ver(0)">✦</div>
      <div class="star s2" id="st1" onclick="ver(1)">✦</div>
      <div class="star s3" id="st2" onclick="ver(2)">✦</div>
      <div class="star s4" id="st3" onclick="ver(3)">✦</div>
      <div class="star s5" id="st4" onclick="ver(4)">✦</div>
      <div class="star s6" id="st5" onclick="ver(5)">✦</div>
      <div class="star s7" id="st6" onclick="ver(6)">✦</div>
      <div class="star s8" id="st7" onclick="ver(7)">✦</div>
      <div class="star s9" id="st8" onclick="ver(8)">✦</div>
      <div class="star s10" id="st9" onclick="ver(9)">✦</div>
      <div class="star s11" id="st10" onclick="ver(10)">✦</div>
      <div class="star s12" id="st11" onclick="ver(11)">✦</div>
      <div class="star s13" id="st12" onclick="ver(12)">✦</div>
      <div class="star s14" id="st13" onclick="ver(13)">✦</div>
      <div class="star s15" id="st14" onclick="ver(14)">✦</div>
      <div class="star s16" id="st15" onclick="ver(15)">✦</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="messageModal">
    <div class="modal-content">
      <div class="modal-text" id="modalText"></div>
      <button class="close-btn" onclick="cerrar()">Cerrar ✨</button>
    </div>
  </div>

  <!-- Botón de Música -->
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
  <div id="ytPlayerContainer"></div>

  <script>
    var msgs = [
      "Qué peligro esa mujer pensé al escucharte por primera vez. Peligrosamente mujer, peligrosamente tú. Y yo, un hombre de aventura y amante de los desafíos, cedí ciegamente a esa sonrisa que aceleraba peligrosamente mis latidos. Una parte dentro de mí me decía tonto, la otra afortunado, pero ninguna de las dos partes jamás pensaron en lo peligrosamente que estarías de ti enamorado. Enamorado de unos peligrosos ojos que paralizan, de unos peligrosos labios que cautivan, de un peligroso cabello que hipnotiza, de un hermoso cuerpo que desde lo lejos al deseo incita. Enamorado de ti, de la maravillosa mujer que eres, peligrosamente mujer, peligrosamente tú.",
      "Dime, ¿crees en la magia? Porque cada momento contigo se siente como algo mágico, como salido de un cuento. Por ratos, mientras hablo contigo, se me viene a la mente la escena de Peter Pan cuando Campanita está muriendo y la reaniman repitiendo que creen en las hadas. Y mágicamente vuelve a la vida. No te lo había dicho, pero eso provoca que sienta mariposas en el estómago. Porque siento que valió la espera que encontré a mi fiel compañera, la otra mitad de la cual no quiero separarme nunca más. Mi querida hada chalada.",
      "Dicen que algunos encuentros lo cambian todo y el nuestro es uno de ellos. Me haces querer ser mejor que ayer y por eso estoy totalmente agradecido contigo. Gracias.",
      "Las semillas no son tan malas después de todo, mi pichoncita. 💖",
      "No a esas preguntas que no tienen respuesta. ✨",
      "Me pareció muy lindo cuando le hablaste a la planta inexistente en audio para que yo escuchara. Qué linda. 🌱❤️",
      "Gracias por los dibujos. Están muy lindos, me encantaron mucho. 🎨✨",
      "Eres lo mejor que me pudo haber pasado. ✨",
      "Te amo, mi amor. ❤️",
      "Gracias por existir, mi princesa. 👑✨",
      "El amor no conoce fronteras ni distancias. Al superar esta etapa seremos muy felices. 💕",
      "Eres la mejor, nunca lo olvides. ✨",
      "Qué peligro, Guillermina. 😏✨",
      "Nuestro primer mes de novios. 🎉❤️",
      "Significas mucho para mí. ✨",
      "Gracias por haber llegado a mi vida. Te amo. ❤️"
    ];

    var openedStars = {};
    var openedCount = 0;

    // Generar más de 65 estrellitas flotantes de fondo
    var bg = document.getElementById('space-bg');
    for (var k = 0; k < 70; k++) {
      var d = document.createElement('div');
      d.className = 'dust';
      d.style.left = Math.floor(Math.random() * 100) + '%';
      d.style.top = Math.floor(Math.random() * 100) + '%';
      var sz = (Math.random() * 2.5 + 1).toFixed(1);
      d.style.width = sz + 'px';
      d.style.height = sz + 'px';
      d.style.animationDuration = (Math.random() * 3 + 1.5).toFixed(1) + 's';
      bg.appendChild(d);
    }

    function ver(i) {
      document.getElementById('modalText').innerText = msgs[i];
      document.getElementById('messageModal').style.display = 'flex';

      if (!openedStars[i]) {
        openedStars[i] = true;
        openedCount++;
        document.getElementById('st' + i).classList.add('opened');
        document.getElementById('progressBadge').innerText = 'Estrellas descubiertas: ' + openedCount + ' / 16';
      }

      if (!musicStarted) {
        startMusic();
      }
    }

    function cerrar() {
      document.getElementById('messageModal').style.display = 'none';
    }

    // Temporizadores
    var dateConocimos = new Date(2025, 2, 15, 0, 0, 0); // 15 Mar 2025
    var dateCercanos  = new Date(2026, 6, 26, 0, 0, 0); // 26 Jul 2026
    var dateNovios    = new Date(2026, 8, 19, 0, 0, 0); // 19 Sep 2026

    function formatTimeDiff(fromDate) {
      var now = new Date();
      var diff = now - fromDate;
      if (diff < 0) diff = 0;

      var seconds = Math.floor((diff / 1000) % 60);
      var minutes = Math.floor((diff / (1000 * 60)) % 60);
      var hours   = Math.floor((diff / (1000 * 60 * 60)) % 24);
      var days    = Math.floor(diff / (1000 * 60 * 60 * 24));

      return days + " días, " + hours + "h " + minutes + "m " + seconds + "s";
    }

    function updateTimers() {
      document.getElementById('timeConocimos').innerText = formatTimeDiff(dateConocimos);
      document.getElementById('timeCercanos').innerText  = formatTimeDiff(dateCercanos);
      document.getElementById('timeNovios').innerText     = formatTimeDiff(dateNovios);
    }

    setInterval(updateTimers, 1000);
    updateTimers();

    // Música de Fondo
    var musicStarted = false;
    var playerIsPlaying = false;

    function startMusic() {
      var container = document.getElementById('ytPlayerContainer');
      container.innerHTML = '<iframe id="yt-player" src="https://www.youtube.com/embed/iP0tHmoc1rs?enablejsapi=1&autoplay=1&loop=1&playlist=iP0tHmoc1rs" allow="autoplay"></iframe>';
      musicStarted = true;
      playerIsPlaying = true;
      document.getElementById('musicBtn').innerText = '🔊';
    }

    function toggleMusic() {
      if (!musicStarted) {
        startMusic();
        return;
      }
      var iframe = document.getElementById('yt-player');
      if (iframe) {
        if (playerIsPlaying) {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          document.getElementById('musicBtn').innerText = '🎵';
          playerIsPlaying = false;
        } else {
          iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          document.getElementById('musicBtn').innerText = '🔊';
          playerIsPlaying = true;
        }
      }
    }
  </script>
</body>
</html>
